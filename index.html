<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CORBIN MOFFITT™ — LIMITED EDITION</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <style>
    :root {
      --bg: #0C0C0C;
      --accent: #E8441A;
      --primary: #F0F0F0;
      --muted: #555555;
      --font-heading: 'Sora', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0C0C0C;
      font-family: var(--font-body);
      cursor: none;
    }
    #logo {
      position: fixed;
      top: 24px; left: 28px;
      z-index: 100;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 20px;
      color: #E8441A;
      text-decoration: none;
    }
    #action-figure {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 480px;
      z-index: 50;
      filter: drop-shadow(0 40px 80px rgba(0,0,0,0.95));
    }
    #scroll-container {
      height: 900vh;
    }
  </style>
</head>
<body>

  <div id="logo">CM™</div>

  <img id="action-figure" src="assets/action-figure.png" alt="Corbin Moffitt" />

  <div id="scroll-container"></div>

  <script>
    window.addEventListener('load', function () {
      console.log('page loaded');
    });
  </script>

</body>
</html>
