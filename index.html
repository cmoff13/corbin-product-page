<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CORBIN MOFFITT™ — LIMITED EDITION</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <style>
    :root {
      --bg: #0C0C0C;
      --accent: #E8441A;
      --primary: #F0F0F0;
      --muted: #555555;
      --font-heading: 'Sora', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0C0C0C;
      font-family: var(--font-body);
      cursor: none;
    }
    #logo {
      position: fixed;
      top: 24px; left: 28px;
      z-index: 100;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 20px;
      color: #E8441A;
      text-decoration: none;
    }
    #action-figure {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 480px;
      z-index: 50;
      filter: drop-shadow(0 40px 80px rgba(0,0,0,0.95));
    }
    #scroll-container {
      height: 900vh;
    }

    /* ——— Loader ——— */
    #loader {
      position: fixed; inset: 0; z-index: 1000;
      pointer-events: none;
    }
    #loader-top {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 50vh;
      background: #0C0C0C;
    }
    #loader-bot {
      position: absolute; bottom: 0; left: 0;
      width: 100%; height: 50vh;
      background: #0C0C0C;
    }
    #loader-text {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center; z-index: 2;
    }
    #loader-eyebrow {
      font-family: var(--font-body);
      font-size: 11px; color: var(--muted);
      letter-spacing: 0.5em; margin-bottom: 12px;
    }
    #loader-title {
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: clamp(60px, 10vw, 120px);
      color: var(--primary); margin: 0;
      line-height: 1;
    }

    /* ——— Hero ——— */
    #hero-content {
      position: fixed; top: 50%; left: 7vw;
      transform: translateY(-50%);
      z-index: 30; opacity: 0;
      max-width: 40vw;
    }
    .eyebrow {
      font-family: var(--font-body);
      font-size: 10px; color: var(--muted);
      letter-spacing: 0.5em; margin-bottom: 16px;
    }
    .hero-name {
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: clamp(56px, 8vw, 110px);
      color: var(--primary);
      line-height: 0.95; margin: 0 0 20px;
    }
    .hero-sub {
      font-family: var(--font-body);
      font-size: 13px; color: var(--muted);
      letter-spacing: 0.1em;
    }
    .scroll-hint {
      font-family: var(--font-body);
      font-size: 10px; color: #333;
      letter-spacing: 0.3em; margin-top: 32px;
      animation: hintPulse 2s ease-in-out infinite;
    }
    @keyframes hintPulse {
      0%, 100% { opacity: 0.3; }
      50%       { opacity: 0.8; }
    }
  </style>
</head>
<body>

  <div id="logo">CM™</div>

  <img id="action-figure" src="assets/action-figure.png" alt="Corbin Moffitt" />

  <div id="loader">
    <div id="loader-top"></div>
    <div id="loader-bot"></div>
    <div id="loader-text">
      <p id="loader-eyebrow">LIMITED EDITION</p>
      <h1 id="loader-title">1 OF 1</h1>
    </div>
  </div>

  <div id="hero-content">
    <p class="eyebrow">SENIOR DESIGNER</p>
    <h2 class="hero-name">CORBIN<br>MOFFITT™</h2>
    <p class="hero-sub">7+ Years · Brand · Web · UX</p>
    <p class="scroll-hint">SCROLL TO EXPLORE ↓</p>
  </div>

  <div id="scroll-container"></div>

  <script>
    window.addEventListener('load', function () {
      console.log('page loaded');

      gsap.registerPlugin(ScrollTrigger);

      const loaderTl = gsap.timeline();
      loaderTl
        .from('#loader-eyebrow', {
          opacity: 0, y: 10, duration: 0.5, ease: 'power3.out'
        })
        .from('#loader-title', {
          opacity: 0, y: 30, duration: 0.7, ease: 'expo.out'
        }, '-=0.2')
        .to({}, { duration: 0.8 })
        .to('#loader-top', {
          yPercent: -100, duration: 0.8, ease: 'expo.inOut'
        }, 'split')
        .to('#loader-bot', {
          yPercent: 100, duration: 0.8, ease: 'expo.inOut'
        }, 'split')
        .from('#action-figure', {
          opacity: 0, scale: 0.9, duration: 0.8, ease: 'expo.out'
        }, 'split+=0.3')
        .from('#logo', {
          opacity: 0, duration: 0.4
        }, 'split+=0.5')
        .to('#hero-content', {
          opacity: 1, y: 0, duration: 0.8, ease: 'power3.out'
        }, 'split+=0.6');
    });
  </script>

</body>
</html>
